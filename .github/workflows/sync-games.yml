name: Sync complete game catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-games.yml"
      - "scripts/sync-games.mjs"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-game-catalog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and combine all providers
        run: node scripts/sync-games.mjs

      - name: Validate generated catalog
        run: node --check data.js

      - name: Commit complete catalog
        shell: bash
        run: |
          if git diff --quiet -- data.js; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Sync complete game catalog"
          git push
